name: Маркет — проверить заявку

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['marketplace/submissions/**']

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Проверить только данные, не запускать код из PR
        run: node marketplace/scripts/run.mjs validate-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
