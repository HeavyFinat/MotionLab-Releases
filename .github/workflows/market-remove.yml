name: Маркет — запрос автора на удаление

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: motionlab-market-main
  cancel-in-progress: false

jobs:
  remove:
    if: >-
      startsWith(github.event.issue.title, '[Маркет: удалить] ')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Проверить GitHub-автора запроса и удалить карточку
        run: node marketplace/scripts/run.mjs remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Сохранить изменения каталога
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- marketplace/moderation.json marketplace/catalog.json marketplace/owners.json marketplace/packages marketplace/previews
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Маркет: убрать публикацию по подтверждённому запросу'
          git push origin HEAD:main
